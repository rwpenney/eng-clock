[package]
name = "eng-clock"
version = "1.1.3"
edition = "2024"

[dependencies]
once_cell = "= 1.20"
cfg-expr = "= 0.15.0"
chrono = "= 0.4.45"
dirs = "= 5.0"
gtk = "= 0.15"
serde = { version = "= 1.0", features = ["derive"] }
serde_spanned = "= 0.6.0"
sntpc = { version = "= 0.10.1", features = ["defmt"] }
sntpc-net-std = "= 1.2.0"
tokio = { version = "1.0", features = ["rt"] }
toml = "= 0.4"
toml_datetime = "= 0.6.0"
